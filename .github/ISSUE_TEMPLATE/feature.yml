name: 기능 구현
description: 명세서(SFR) 항목 구현 작업
title: "[SFR-000] "
labels: [feature]
body:
  - type: input
    id: sfr
    attributes:
      label: 명세서 항목
      description: 구현할 SFR 번호와 이름
      placeholder: SFR-015 캐릭터 이동
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 이번 이슈에서 만들 것 / 만들지 않을 것
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 어떤 동작이 확인되면 완료인지
      placeholder: |
        - [ ] WASD/방향키로 4방향 이동
        - [ ] UI가 열려 있으면 이동 입력 무시
  - type: input
    id: scenes
    attributes:
      label: 수정할 씬 / 프리팹
      description: 씬 충돌 방지를 위해 미리 적어 두기
      placeholder: Cafe.unity, Prefabs/Player/Player.prefab
